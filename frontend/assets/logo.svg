<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="cnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="signalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  
  <!-- Wi-Fi / Radio Wave Signal Mark -->
  <g transform="translate(20, 15)">
    <!-- Base dot -->
    <circle cx="35" cy="55" r="6" fill="url(#cnGrad)" />
    <!-- Inner arc -->
    <path d="M20 42 A 22 22 0 0 1 50 42" stroke="url(#cnGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Middle arc -->
    <path d="M10 30 A 35 35 0 0 1 60 30" stroke="url(#signalGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <!-- Outer arc -->
    <path d="M0 18 A 48 48 0 0 1 70 18" stroke="#0284C7" stroke-width="4.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography -->
  <text x="105" y="48" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="1.5" fill="#0F172A">
    CLASSIC <tspan fill="#0284C7">NET</tspan>
  </text>
  <text x="106" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="11" letter-spacing="3" fill="#64748B">
    HOTSPOT &amp; BROADBAND
  </text>
</svg>
